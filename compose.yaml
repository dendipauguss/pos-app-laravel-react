services:
    app:
        build:
            context: .
            target: app
        env_file:
            - .env.docker
        restart: unless-stopped
        volumes:
            - laravel_storage:/var/www/html/storage
        depends_on:
            pgsql:
                condition: service_healthy

    nginx:
        build:
            context: .
            target: web
        restart: unless-stopped
        ports:
            - "8080:80"
        volumes:
            - laravel_storage:/var/www/html/storage
        depends_on:
            - app

    worker:
        build:
            context: .
            target: app
        env_file:
            - .env.docker
        command: php artisan queue:work database --sleep=3 --tries=3 --timeout=90
        restart: unless-stopped
        volumes:
            - laravel_storage:/var/www/html/storage
        depends_on:
            pgsql:
                condition: service_healthy

    pgsql:
        image: postgres:16-alpine
        restart: unless-stopped
        environment:
            POSTGRES_DB: pos
            POSTGRES_USER: pos
            POSTGRES_PASSWORD: pos_password
        volumes:
            - pgsql_data:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U pos -d pos"]
            interval: 5s
            timeout: 5s
            retries: 20

volumes:
    laravel_storage:
    pgsql_data: